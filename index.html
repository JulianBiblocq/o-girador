        <h1>Sequenciador — L'atelier circulaire du Maracatu de Baque Virado — Rythme, Chant &amp; Partition</h1>
        <p><strong>A oficina circular do Maracatu de Baque Virado — Ritmo, Canto e Partitura.</strong></p>
        <p>Le Maracatu vit dans la rue, par le chant, l'écoute et la transmission directe des mestres. Pensé comme un carnet de mémoire — sans jamais remplacer les répétitions — Sequenciador réunit sur un même établi la tourne à 360° du batuque, l'écriture multipiste, les toadas et le cahier papier.</p>

        </article>
        <article>
          <h3>Livret 02 : Pratique, Lecture &amp; Chant</h3>
          <p>Mode Pratique &amp; Tocar Junto, Mode Lecture sur mobile pour gérer les 6 familles d'instruments, Toadas et Signes du Mestre.</p>
        </article>
        <article>
          <h3>Livret 03 : Du Papier au Son</h3>
          <p>Tablatures vierges gratuites A4, Scanner Photo de grilles manuscrites et Presse PDF de partitions et Mini-Rodas.</p>
        </article>
        <article>
          <h3>Livret 04 : L'Écosystème O Girador</h3>
          <p>Organizador &amp; Mostrador, Cantador et Orquestrador — carte mondiale des Nações et groupes de Maracatu.</p>

    <script>
      // Auto-recover from Vite dynamic chunk import failures (e.g. after a new deployment)
      window.addEventListener('vite:preloadError', function(event) {
        if (event && typeof event.preventDefault === 'function') {
          event.preventDefault(); // Stop Vite from re-throwing the preload error
        }
        console.warn('[Vite] Preload error detected. Reloading for fresh deployment chunks...');
        const reloadKey = 'vite_preload_reload';
        const lastReload = parseInt(sessionStorage.getItem(reloadKey) || '0', 10);
        if (Date.now() - lastReload > 15000) {
          sessionStorage.setItem(reloadKey, String(Date.now()));
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (let reg of regs) { reg.unregister(); }
              window.location.reload();
            }).catch(function() { window.location.reload(); });
          } else {
            window.location.reload();
          }
        }
      });

      window.onerror = function(message, source, lineno, colno, error) {
        const msgStr = String(message || '').toLowerCase();
        // Auto-recover from module load errors (MIME type / cache / chunk missing issues)
        if (msgStr.includes('module script') || 
            msgStr.includes('dynamically imported module') ||
            msgStr.includes('text/html')) {
          const reloadKey = 'chunk_reload_error';
          const lastReload = parseInt(sessionStorage.getItem(reloadKey) || '0', 10);
          if (Date.now() - lastReload > 15000) {
            sessionStorage.setItem(reloadKey, String(Date.now()));
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (let reg of regs) { reg.unregister(); }
                window.location.reload();
              }).catch(function() { window.location.reload(); });
            } else {
              window.location.reload();
            }
          }
          return true; // Empêche l'affichage de l'erreur
        }

        // Remplacé par un warning silencieux en console pour maintenir l'interface 100% jouable
        console.warn('[Ignored Runtime Error]:', message, error);
        return true;
      };

      // Bug 4: Patch removeChild and insertBefore to prevent React crashes from browser extensions (Google Translate, etc.)
      if (typeof Node !== 'undefined' && Node.prototype) {
        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function(child) {
          if (child.parentNode !== this) {
            console.warn('React Extension Crash Prevented: Cannot remove a child from a different parent', child, this);
            return child;
          }
          return originalRemoveChild.apply(this, arguments);
        };
        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function(newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            console.warn('React Extension Crash Prevented: Cannot insert before a reference node from a different parent', referenceNode, this);
            return newNode;
          }
          return originalInsertBefore.apply(this, arguments);
        };
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('error', function(event) {
        const msgStr = String(event?.message || '').toLowerCase();
        if (msgStr.includes('module script') || msgStr.includes('dynamically imported module') || msgStr.includes('text/html')) {
          return;
        }
        console.warn('[Ignored Runtime Error]:', event?.message || event, event?.error);
      });
      window.addEventListener('unhandledrejection', function(event) {
        const msg = event.reason && event.reason.message ? event.reason.message : event.reason;
        const msgStr = String(msg || '').toLowerCase();
        
        // Catch dynamic import failures in promises and force reload to fetch new chunks
        if (msgStr.includes('dynamically imported module') || msgStr.includes('module script') || msgStr.includes('text/html')) {
          const reloadKey = 'chunk_reload_rejection';
          const lastReload = parseInt(sessionStorage.getItem(reloadKey) || '0', 10);
          if (Date.now() - lastReload > 15000) {
            sessionStorage.setItem(reloadKey, String(Date.now()));
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (let reg of regs) { reg.unregister(); }
                window.location.reload();
              }).catch(function() { window.location.reload(); });
            } else {
              window.location.reload();
            }
          }
          return;
        }

        console.warn('[Ignored Promise Rejection]:', msg);
      });
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (isLocalhost) {
          // Quietly unregister active service workers on localhost without forcing continuous reloads
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
        } else {
          window.addEventListener('load', () => {
            const base = '%BASE_URL%';
            navigator.serviceWorker.register(base + 'sw.js')
              .then(reg => {
                // console.log('Service Worker registered:', reg.scope);
                
                // If there's already a waiting worker on load, prompt the user
                if (reg.waiting) {
                  // console.log('Service Worker waiting on load; prompting refresh.');
                  setTimeout(() => {
                    window.dispatchEvent(new CustomEvent('sw-update-available', { detail: reg }));
                  }, 1000);
                }

                // Detect updates to the service worker code
                reg.onupdatefound = () => {
                  const installingWorker = reg.installing;
                  if (installingWorker) {
                    installingWorker.onstatechange = () => {
                      if (installingWorker.state === 'installed') {
                        if (navigator.serviceWorker.controller) {
                          // A new service worker has been installed and is ready to activate
                          
                          // If the app is broken (e.g., React failed to mount due to old JS missing), 
                          // automatically skip waiting and reload to break the deadlock
                          const appRoot = document.getElementById('root');
                          if (!appRoot || appRoot.innerHTML.trim() === '') {
                            console.warn('App not mounted. Forcing SW update to recover.');
                            reg.waiting && reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                            window.location.reload();
                            return;
                          }

                          window.dispatchEvent(new CustomEvent('sw-update-available', { detail: reg }));
                        }
                      }
                    };
                  }
                };
              })
              .catch(err => console.error('Service Worker registration failed:', err));
          });
        }
      }
    </script>
