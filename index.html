    <noscript>
      <div style="padding: 2rem; background: #f4ecd8; color: #1a1a1a; font-family: serif; max-width: 900px; margin: 0 auto;">
        <h1>O Girador — Séquenceur de Maracatu de Baque Virado</h1>
        <p><strong>O sequenciador circular dedicado ao Maracatu de Baque Virado de Recife e Pernambuco.</strong></p>
        <p>O Girador est un outil interactif, une boîte à rythmes et un carnet de notes musical conçu pour documenter, décortiquer et transmettre les toadas et les rythmes traditionnels de Maracatu de Baque Virado. Il permet de visualiser le cycle en 360°, d'isoler chaque pupitre d'instruments (Alfaia, Caixa, Tarol, Gonguê, Agbê, Mineiro) et de restituer le balanço organique grâce à un réglage fin du micro-timing.</p>
        
        <h2>Les 4 Livrets de Cordel de l'Écosystème O Girador</h2>
        <article>
          <h3>Livret 01 : La tradition orale (« La mémoire d'abord »)</h3>
          <p>Le Maracatu de Baque Virado vit dans la rue, par le chant, l'écoute et la transmission directe des mestres. Cet outil ne remplace ni les répétitions ni l'enseignement oral. Il a été pensé comme un carnet de notes : un support pour poser des repères, documenter les toadas et mémoriser les arrangements de chaque batuque et Nações.</p>
        </article>
        <article>
          <h3>Livret 02 : Le Séquenceur (« Apprendre et décortiquer le baque »)</h3>
          <p>Cycle à 360°, écoute analytique par pupitre, banques de sons acoustiques enregistrées sur instruments réels et réglage fin du micro-timing (balanço).</p>
        </article>
        <article>
          <h3>Livret 03 : Organizador & Dançador (« De la partition à la répétition »)</h3>
          <p>Passerelle pédagogique, partitions pour conducteurs de répétition et synchronisation des mouvements de danse traditionnelle.</p>
        </article>
        <article>
          <h3>Livret 04 : Orquestrad'Or (« Connecter les Nações et les groupes »)</h3>
          <p>Cartographie mondiale des groupes et Nações de Maracatu et partage d'arrangements.</p>
        </article>
        
        <h2>Applications de l'Écosystème O Girador</h2>
        <ul>
          <li><a href="https://www.o-girador.com">Orquestrad'Or — Hub central et cartographie mondiale</a></li>
          <li><a href="https://organizador.o-girador.com/demo">Organizad'Or — Gestion d'association et atelier pédagogique</a></li>
          <li><a href="https://dancador.o-girador.com">Dançad'Or — Chorégraphie et danse</a></li>
          <li><a href="https://www.o-girador.com/#legal">Cadre Légal, Mentions Légales & Confidentialité</a></li>
        </ul>
        <p><em>Veuillez activer JavaScript dans votre navigateur pour profiter de l'expérience interactive 360° et du moteur audio haute fidélité d'O Girador.</em></p>
